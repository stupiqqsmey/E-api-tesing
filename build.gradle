plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ite-istad-product'
version = '0.0.1-SNAPSHOT'
description = 'product-api-simple-demo'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {

	// ===========================
	// Spring Boot Starters
	// ===========================
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// ===========================
	// OAuth2 Resource Server (JWT)
	// ===========================
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	// ===========================
	// Keycloak
	// ===========================
	implementation 'org.keycloak:keycloak-admin-client:23.0.7'
	implementation 'org.keycloak:keycloak-core:23.0.7'

	// ===========================
	// PostgreSQL
	// ===========================
	runtimeOnly 'org.postgresql:postgresql'

	// ===========================
	// API Documentation
	// ===========================
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-scalar:3.0.3'

	// ===========================
	// Lombok
	// ===========================
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// ===========================
	// MapStruct
	// ===========================
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	// ===========================
	// Configuration Processor
	// ===========================
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	// ===========================
	// Testing
	// ===========================
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}